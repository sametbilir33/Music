
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#dce7ef"/>
      <stop offset="1" stop-color="#aebdca"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aebbc6"/>
      <stop offset=".45" stop-color="#f0f3f5"/>
      <stop offset="1" stop-color="#a8b6c2"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff17a"/>
      <stop offset=".55" stop-color="#f6d32d"/>
      <stop offset="1" stop-color="#d9a817"/>
    </linearGradient>

    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c69b18"/>
      <stop offset=".35" stop-color="#ffe66b"/>
      <stop offset="1" stop-color="#d7a91d"/>
    </linearGradient>

    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#424257"/>
      <stop offset="1" stop-color="#202031"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <path d="M12 34 Q12 12 34 12 H94 Q116 12 116 34 V94 Q116 116 94 116 H34 Q12 116 12 94Z"
        fill="#8494a1"/>

  <path d="M12 30 Q12 12 30 12 H98 Q116 12 116 30 V90 Q116 108 98 108 H30 Q12 108 12 90Z"
        fill="url(#background)"/>

  <!-- Headband bottom profile -->
  <path d="M26 76 V56 C26 32 43 18 64 18 C85 18 102 32 102 56 V76
           H90 V56 C90 39 79 29 64 29 C49 29 38 39 38 56 V76Z"
        fill="#737f8d"
        transform="translate(0 3)"/>

  <!-- Headband -->
  <path d="M26 73 V56 C26 32 43 18 64 18 C85 18 102 32 102 56 V73
           H90 V56 C90 39 79 29 64 29 C49 29 38 39 38 56 V73Z"
        fill="url(#silver)"/>

  <!-- Headband inner edge -->
  <path d="M40 55 C40 40 50 31 64 31 C78 31 88 40 88 55"
        fill="none" stroke="#f8fafb" stroke-width="2"
        stroke-linecap="round" opacity=".8"/>

  <!-- Left hinge -->
  <path d="M28 60 L43 60 L43 77 L28 77Z"
        fill="#8795a2"/>
  <path d="M30 58 L42 58 L42 74 L30 74Z"
        fill="#d0d9df"/>

  <!-- Right hinge -->
  <path d="M85 60 L100 60 L100 77 L85 77Z"
        fill="#8795a2"/>
  <path d="M86 58 L98 58 L98 74 L86 74Z"
        fill="#d0d9df"/>

  <!-- Left ear cup front profile -->
  <path d="M20 66 Q20 59 28 59 H39 Q47 59 47 68 V88
           Q47 98 38 100 H29 Q20 100 20 91Z"
        fill="#94721a"/>

  <!-- Left ear cup -->
  <path d="M20 63 Q20 56 28 56 H39 Q47 56 47 65 V85
           Q47 95 38 97 H29 Q20 97 20 88Z"
        fill="url(#cup)"/>

  <!-- Left cushion -->
  <path d="M27 65 Q27 62 32 62 H36 Q40 62 40 68 V85
           Q40 90 35 91 H32 Q27 91 27 86Z"
        fill="url(#cushion)"/>

  <!-- Right ear cup front profile -->
  <path d="M81 68 Q81 59 89 59 H100 Q108 59 108 66 V91
           Q108 100 99 100 H90 Q81 98 81 88Z"
        fill="#94721a"/>

  <!-- Right ear cup -->
  <path d="M81 65 Q81 56 89 56 H100 Q108 56 108 63 V88
           Q108 97 99 97 H90 Q81 95 81 85Z"
        fill="url(#cup)"/>

  <!-- Right cushion -->
  <path d="M88 68 Q88 62 92 62 H96 Q101 62 101 65 V86
           Q101 91 96 91 H93 Q88 90 88 85Z"
        fill="url(#cushion)"/>

  <!-- Cup highlights -->
  <path d="M23 65 V82" stroke="#fff4a5"
        stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <path d="M84 65 V82" stroke="#fff4a5"
        stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- Subtle center sound detail -->
  <path d="M57 76 V68 M64 80 V64 M71 76 V68"
        fill="none" stroke="#f6d32d"
        stroke-width="3" stroke-linecap="round"/>
</svg>
